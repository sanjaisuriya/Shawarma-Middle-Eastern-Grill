<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="600" height="450" fill="#1E1E24"/>
  <circle cx="300" cy="225" r="140" fill="#E5A93B" opacity="0.2"/>
  <!-- Chef silhouette art with knife and vertical spit -->
  <path d="M 240 380 Q 240 260 300 240 Q 360 260 360 380 Z" fill="#C83E2B"/>
  <circle cx="300" cy="200" r="45" fill="#FAF6F0"/>
  <!-- Chef Toque Hat -->
  <path d="M 260 180 C 260 130, 340 130, 340 180 Z" fill="#FFFFFF"/>
  <rect x="260" y="175" width="80" height="15" fill="#FFFFFF"/>
  <!-- Long Carving Knife -->
  <line x1="330" y1="260" x2="450" y2="180" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <text x="300" y="410" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#E5A93B" text-anchor="middle">Master Chef Carving Artistry</text>
</svg>
