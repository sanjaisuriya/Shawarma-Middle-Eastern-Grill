<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="grillFire" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="40%" stop-color="#C83E2B"/>
      <stop offset="100%" stop-color="#121214"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#121214"/>
  <rect width="800" height="600" fill="url(#grillFire)" opacity="0.6"/>
  
  <!-- Grill Mesh Grate -->
  <g stroke="#33333F" stroke-width="4">
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="250" x2="750" y2="250"/>
    <line x1="50" y1="300" x2="750" y2="300"/>
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="50" y1="400" x2="750" y2="400"/>

    <line x1="150" y1="150" x2="150" y2="450"/>
    <line x1="250" y1="150" x2="250" y2="450"/>
    <line x1="350" y1="150" x2="350" y2="450"/>
    <line x1="450" y1="150" x2="450" y2="450"/>
    <line x1="550" y1="150" x2="550" y2="450"/>
    <line x1="650" y1="150" x2="650" y2="450"/>
  </g>

  <!-- Skewers of Lamb & Shish Taook -->
  <!-- Skewer 1 -->
  <rect x="180" y="210" width="440" height="24" rx="12" fill="#701A0B"/>
  <line x1="120" y1="222" x2="680" y2="222" stroke="#E5A93B" stroke-width="4"/>
  <!-- Skewer 2 -->
  <rect x="180" y="270" width="440" height="24" rx="12" fill="#D97724"/>
  <line x1="120" y1="282" x2="680" y2="282" stroke="#E5A93B" stroke-width="4"/>
  <!-- Skewer 3 -->
  <rect x="180" y="330" width="440" height="24" rx="12" fill="#8D230F"/>
  <line x1="120" y1="342" x2="680" y2="342" stroke="#E5A93B" stroke-width="4"/>

  <!-- Roasted Tomatoes & Peppers -->
  <circle cx="220" cy="180" r="25" fill="#D32F2F"/>
  <circle cx="580" cy="180" r="25" fill="#2E7D32"/>

  <!-- Flames & Smoke -->
  <path d="M 280 430 Q 300 370 290 320" stroke="#FF9800" stroke-width="6" fill="none" opacity="0.8"/>
  <path d="M 400 440 Q 380 360 410 300" stroke="#FF5722" stroke-width="8" fill="none" opacity="0.9"/>
  <path d="M 520 430 Q 540 370 510 320" stroke="#FF9800" stroke-width="6" fill="none" opacity="0.8"/>

  <!-- Badge Overlay -->
  <rect x="50" y="500" width="260" height="46" rx="23" fill="#C83E2B"/>
  <text x="180" y="529" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">🔥 100% NATURAL OAK CHARCOAL</text>
</svg>
